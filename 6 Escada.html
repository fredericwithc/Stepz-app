<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Stepz — suba a página</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--text:#ececf0;--dim:rgba(236,236,240,.62);--faint:rgba(236,236,240,.38);--purple:#7c5cff;--purple-l:#a98aff;--gold:oklch(0.78 0.14 70);--line:rgba(255,255,255,.1)}
html{scroll-behavior:smooth}
html,body{margin:0;background:#0a0a0b;color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
body{overflow-x:hidden}
a{color:var(--purple-l);text-decoration:none}a:hover{color:#fff}
/* ── fixed stage ── */
#stage{position:fixed;inset:0;overflow:hidden;z-index:1}
#sky{position:absolute;inset:0;background:#0a0a0b;transition:background-color 1.1s ease}
#sky::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 100%,rgba(0,0,0,.45),transparent)}
#stars{position:absolute;inset:0;opacity:.5}
#cam{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform}
/* steps live in camera space, origin = character's feet */
.st{position:absolute;width:var(--sw);height:60vh;border-top:2px solid var(--purple-l);background:linear-gradient(180deg,rgba(124,92,255,.22),rgba(124,92,255,.02));border-left:1px solid rgba(255,255,255,.07)}
.st.gold{border-top-color:var(--gold);background:linear-gradient(180deg,oklch(0.78 0.14 70 / .22),transparent)}
.st .riser{position:absolute;left:0;top:0;bottom:0;width:1px;background:rgba(255,255,255,.08)}
.st .num{position:absolute;top:14px;left:16px;font-size:12px;letter-spacing:2px;color:var(--faint)}
.st .name{position:absolute;top:-46px;left:16px;font-size:15px;font-weight:600;color:#fff;white-space:nowrap;opacity:0;transition:opacity .45s}
.st.on .name{opacity:1}
.st.gold .name{color:var(--gold)}
/* walker */
#walker{position:absolute;z-index:3;transition:transform .25s ease-out}
#walker .body{width:20px;height:20px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 6px rgba(124,92,255,.18),0 0 34px rgba(124,92,255,.7)}
#walker .shadow{width:34px;height:7px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(3px);margin:6px 0 0 -7px}
/* ── content overlay ── */
#scrim{position:fixed;inset:0;z-index:2;pointer-events:none;background:linear-gradient(100deg,rgba(10,10,11,.94) 0%,rgba(10,10,11,.82) 34%,rgba(10,10,11,.3) 52%,transparent 66%)}
#panel{position:fixed;z-index:4;left:0;right:0;bottom:0;padding:0 clamp(22px,5vw,64px) clamp(34px,6vh,64px);pointer-events:none}
.card{max-width:min(520px,46vw);pointer-events:auto;opacity:0;transform:translateY(22px);transition:opacity .4s,transform .5s cubic-bezier(.2,.9,.3,1);position:absolute;bottom:clamp(34px,6vh,64px)}
.card.on{opacity:1;transform:none;position:relative}
.tag{font-size:11px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:var(--purple-l);margin-bottom:14px;display:flex;gap:10px;align-items:center}
.tag i{width:22px;height:1px;background:var(--purple-l);display:block}
.card.gold .tag{color:var(--gold)}.card.gold .tag i{background:var(--gold)}
h1{font-size:clamp(34px,6.4vw,70px);font-weight:700;letter-spacing:-2.6px;line-height:.98;margin:0 0 18px;color:#fff;text-wrap:balance}
h2{font-size:clamp(26px,4.4vw,44px);font-weight:700;letter-spacing:-1.6px;line-height:1.04;margin:0 0 14px;color:#fff;text-wrap:balance}
.card p{font-size:16.5px;line-height:1.58;color:var(--dim);margin:0;max-width:46ch;text-wrap:pretty}
.ctas{display:flex;gap:11px;flex-wrap:wrap;margin-top:26px}
.b1{background:var(--purple);color:#fff;font-weight:600;font-size:15.5px;padding:14px 26px;border-radius:100px}
.b1:hover{background:#5b3fd6;color:#fff}
.b2{border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:500;font-size:15.5px;padding:14px 24px;border-radius:100px}
.b2:hover{border-color:#fff}
/* chrome */
nav{position:fixed;z-index:6;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(22px,5vw,64px)}
.brand{display:flex;gap:9px;align-items:center;font-weight:700;font-size:19px;letter-spacing:-.5px;color:#fff}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--purple);display:block}
nav .in{font-size:14px;font-weight:500;color:rgba(255,255,255,.7);border:1px solid var(--line);padding:8px 16px;border-radius:100px;background:rgba(10,10,11,.4);backdrop-filter:blur(6px)}
nav .in:hover{border-color:#fff;color:#fff}
#rail{position:fixed;z-index:6;right:clamp(14px,2.4vw,26px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#rail a{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:1.4px;color:transparent;transition:color .25s}
#rail a b{width:14px;height:2px;background:rgba(255,255,255,.2);display:block;transition:all .25s}
#rail a.on b{width:30px;background:var(--purple-l)}
#rail a.on{color:var(--faint)}
#rail a:hover{color:var(--faint)}
#alt{position:fixed;z-index:6;left:clamp(22px,5vw,64px);bottom:clamp(12px,2vh,20px);font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
#hint{position:fixed;z-index:6;left:50%;bottom:16px;transform:translateX(-50%);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);transition:opacity .4s}
#hint.hide{opacity:0}
#hint span{display:inline-block;animation:bob 1.7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
/* scroll track */
#track{position:relative;z-index:0}
.slot{height:100vh}
@media(max-width:860px){.card{max-width:560px}#scrim{background:linear-gradient(180deg,rgba(10,10,11,.5),rgba(10,10,11,.92) 46%)}}
@media(max-width:700px){#rail a{display:none}.card p{font-size:15.5px}}
</style>
</head>
<body>

<nav><div class="brand"><i></i>Stepz</div><a href="../Stepz.html" class="in">Entrar</a></nav>

<div id="stage">
  <div id="sky"></div>
  <svg id="stars"></svg>
  <div id="cam"></div>
  <div id="scrim"></div>
  <div id="walker"><div class="body"></div><div class="shadow"></div></div>
</div>

<div id="panel"></div>
<div id="rail"></div>
<div id="alt">degrau <b id="altn">01</b> / 08</div>
<div id="hint"><span>role para subir ↓</span></div>
<div id="track"></div>

<script>
const STEPS=[
 {n:"01",name:"O chão",tag:"degrau 01 · o chão",h1:"Você já subiu mais<br>do que lembra.",p:"A memória guarda o que falta, não o que foi feito. Stepz existe para dar altura visível ao esforço que já aconteceu. Role a página: cada rolada sobe um degrau.",sky:"#0a0a0b",cta:1},
 {n:"02",name:"Um degrau = uma coisa feita",tag:"degrau 02 · despertar",h2:"Um degrau é uma coisa feita. Nada além disso.",p:"Uma tarefa concluída. Um dia de hábito mantido. Não existe pontuação secreta, multiplicador nem castigo por falhar. A escada só sabe somar.",sky:"#17162b"},
 {n:"03",name:"Tarefas e hábitos",tag:"degrau 03 · registro",h2:"Tarefas e hábitos no mesmo lugar.",p:"Tarefa fecha uma vez e vale um degrau. Hábito vale um degrau a cada dia marcado. Sem projetos, sem sprints, sem campo obrigatório.",sky:"#131a2d"},
 {n:"04",name:"Zoom até o nome",tag:"degrau 04 · a vista",h2:"De longe, a altura. De perto, os nomes.",p:"A escada tem zoom. Afastada, é uma silhueta com marcos dourados. Aproximada, cada degrau mostra a tarefa exata que o construiu e o dia em que aconteceu.",sky:"#0f1d29"},
 {n:"05",name:"Post-its",tag:"degrau 05 · memória",h2:"Post-its para o que não é tarefa.",p:"Ideia solta, desabafo de meio de semana, o que ficou atravessado. Um quadro ao lado da escada — sem virar mais uma lista de pendências.",sky:"#0f2019"},
 {n:"06",name:"Patamares",tag:"degrau 06 · patamar",h2:"A cada dez degraus, um marco que não sai mais.",p:"Oito patamares, do Despertar à Plenitude. Não é um selo inventado: são dez degraus reais, e a paisagem atrás da escada muda para provar que você chegou em outro lugar.",sky:"#241f11",gold:1},
 {n:"07",name:"Seus dados",tag:"degrau 07 · guarda",h2:"Roda no navegador. Fica com você.",p:"Salvo localmente, sem conta para começar a testar. Sua escada é um arquivo seu, não um perfil nosso.",sky:"#1c142a"},
 {n:"08",name:"Seu primeiro degrau",tag:"degrau 08 · o topo, por hoje",h2:"Sua escada começa vazia.",p:"Em quarenta segundos ela tem um degrau. Em um mês, uma altura que você não conseguiria descrever de memória.",sky:"#171331",cta:2}
];
const cam=document.getElementById('cam'),panel=document.getElementById('panel'),rail=document.getElementById('rail'),track=document.getElementById('track'),walker=document.getElementById('walker'),sky=document.getElementById('sky'),altn=document.getElementById('altn'),hint=document.getElementById('hint');
let SW=0,SH=0,W=0,H=0,ANCHOR_X=0,ANCHOR_Y=0;
function dims(){W=innerWidth;H=innerHeight;SW=Math.min(Math.max(W*.30,210),400);SH=Math.min(Math.max(H*.14,72),150);ANCHOR_X=W<860?W*.30:W*.54;ANCHOR_Y=H*.62;ANCHOR_Y=H*.60}
dims();

// stair + labels in camera space
cam.innerHTML=STEPS.map((s,i)=>`<div class="st${s.gold?' gold':''}" id="st${i}" style="--sw:${SW}px"><div class="riser"></div><div class="num">${String(i+1).padStart(2,'0')}</div><div class="name">${s.name}</div></div>`).join('');
// content cards
panel.innerHTML=STEPS.map((s,i)=>`<div class="card${s.gold?' gold':''}" id="cd${i}"><div class="tag"><i></i>${s.tag}</div>${s.h1?`<h1>${s.h1}</h1>`:`<h2>${s.h2}</h2>`}<p>${s.p}</p>${s.cta?`<div class="ctas"><a href="../Stepz.html" class="b1">${s.cta===1?'Começar grátis':'Construir o primeiro degrau'}</a>${s.cta===1?'<a href="#s1" class="b2">Ver como funciona</a>':'<a href="../Stepz.html" class="b2">Entrar</a>'}</div>`:''}</div>`).join('');
rail.innerHTML=STEPS.map((s,i)=>`<a href="#s${i}" id="rl${i}">${s.n}<b></b></a>`).join('');
track.innerHTML=STEPS.map((s,i)=>`<div class="slot" id="s${i}"></div>`).join('');

const sts=STEPS.map((_,i)=>document.getElementById('st'+i)),cds=STEPS.map((_,i)=>document.getElementById('cd'+i)),rls=STEPS.map((_,i)=>document.getElementById('rl'+i));
function place(){
  dims();
  sts.forEach((el,i)=>{el.style.setProperty('--sw',SW+'px');el.style.left=(ANCHOR_X+i*SW)+'px';el.style.top=(ANCHOR_Y-i*SH)+'px'});
  walker.style.left=ANCHOR_X+SW*.5-10+'px';walker.style.top=ANCHOR_Y-30+'px';
}
place();
let cur=-1,lastY=-1,lastW=0,lastH=0;
function frame(){
  const p=Math.max(0,Math.min(STEPS.length-1,scrollY/innerHeight));
  cam.style.transform=`translate3d(${-p*SW}px,${p*SH}px,0)`;
  const i=Math.round(p);
  walker.style.transform=`translateY(${(p-i)*-6}px)`;
  if(i!==cur){
    cur=i;
    sts.forEach((el,k)=>el.classList.toggle('on',k===i));
    cds.forEach((el,k)=>el.classList.toggle('on',k===i));
    rls.forEach((el,k)=>el.classList.toggle('on',k<=i));
    sky.style.backgroundColor=STEPS[i].sky;
    altn.textContent=String(i+1).padStart(2,'0');
  }
  hint.classList.toggle('hide',scrollY>innerHeight*.35);
}
function tick(){
  if(innerWidth!==lastW||innerHeight!==lastH){lastW=innerWidth;lastH=innerHeight;place();lastY=-1}
  if(scrollY!==lastY){lastY=scrollY;frame()}
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// stars
const svg=document.getElementById('stars');let d='';
for(let k=0;k<70;k++){const x=Math.random()*100,y=Math.random()*70,r=Math.random()*1.3+.3,o=Math.random()*.5+.15;d+=`<circle cx="${x}%" cy="${y}%" r="${r}" fill="#fff" opacity="${o}"/>`}
svg.innerHTML=d;
frame();
</script>
</body>
</html>
