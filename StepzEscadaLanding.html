  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

id{height:30vh;opacity:.6}\n#near{height:22vh;opacity:.85}\n#horizon{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(169,138,255,.45),transparent);will-change:transform}\n#fog{position:absolute;left:0;right:0;bottom:0;height:34vh;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(10,10,11,.5) 60%,rgba(10,10,11,.86))}\n/* altímetro */\n#alti{position:fixed;z-index:6;left:clamp(10px,1.6vw,20px);top:0;bottom:0;width:62px;pointer-events:none;overflow:hidden}\n#ruler{position:absolute;left:0;top:50%;will-change:transform}\n#ruler .tk{position:absolute;left:0;display:flex;align-items:center;gap:7px;transform:translateY(-50%)}\n#ruler .tk b{width:10px;height:1px;background:rgba(255,255,255,.22);display:block}\n#ruler .tk.big b{width:20px;background:rgba(169,138,255,.65)}\n#ruler .tk span{font-size:9.5px;letter-spacing:1.2px;color:var(--faint)}\n#ruler .tk.big span{color:var(--purple-l)}\n#mark{position:fixed;z-index:6;left:clamp(10px,1.6vw,20px);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px}\n#mark .ln{width:26px;height:2px;background:var(--purple);display:block}\n#meters{display:inline;font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:1.6px;color:var(--purple-l)}\n#meters small{display:none}\n#cam{position:absolute;left:0;top:0;will-change:transform}\n/* a step is a panel that widens when you arrive on it */\n.st{position:absolute;border-bottom:2px solid var(--purple-l);background:linear-gradient(180deg,rgba(124,92,255,.03),rgba(124,92,255,.13));border-left:1px solid rgba(255,255,255,.07);border-radius:3px 3px 0 0}\n.st::after{content:\"\";position:absolute;left:-1px;right:0;top:100%;height:70vh;background:linear-gradient(180deg,rgba(124,92,255,.16),rgba(124,92,255,0));border-left:1px solid rgba(255,255,255,.07)}\n.st.on{background:linear-gradient(180deg,rgba(14,14,20,.62),rgba(124,92,255,.14))}\n.st.gold{border-bottom-color:var(--gold)}\n.st.gold::after{background:linear-gradient(180deg,oklch(0.78 0.14 70 / .16),transparent)}\n.st .num{position:absolute;top:11px;left:18px;font-size:11.5px;letter-spacing:2.2px;color:var(--faint)}\n.st .name{position:absolute;top:calc(100% + 12px);left:18px;font-size:14.5px;font-weight:600;color:#fff;white-space:nowrap;opacity:0;transition:opacity .4s}\n.st.on .name{opacity:1}\n.st.gold .name{color:var(--gold)}\n/* inside content, revealed as the step opens */\n.inner{position:absolute;left:18px;right:22px;top:36px;bottom:20px;display:grid;grid-template-columns:minmax(0,.84fr) minmax(0,1.16fr);grid-template-rows:minmax(0,1fr);gap:30px;align-items:stretch;opacity:0;transition:opacity .35s;pointer-events:none;overflow:hidden}\n.inner>div{min-height:0;min-width:0;overflow:hidden}\n.st.on .inner{opacity:1;pointer-events:auto}\n.st.solo .inner{grid-template-columns:minmax(0,1fr)}\n.tag{font-size:10.5px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:var(--purple-l);margin-bottom:13px;display:flex;gap:9px;align-items:center}\n.tag i{width:20px;height:1px;background:var(--purple-l);display:block}\n.gold .tag{color:var(--gold)}.gold .tag i{background:var(--gold)}\nh1{font-size:clamp(26px,min(4.4vw,7vh),56px);font-weight:700;letter-spacing:-2.2px;line-height:1;margin:0 0 min(16px,2vh);color:#fff;text-wrap:balance}\nh2{font-size:clamp(21px,min(2.6vw,4.6vh),34px);font-weight:700;letter-spacing:-1.2px;line-height:1.06;margin:0 0 min(12px,1.6vh);color:#fff;text-wrap:balance}\n.inner p{font-size:clamp(14px,min(1.15vw,2.9vh),16px);line-height:1.55;color:var(--dim);margin:0;max-width:44ch;text-wrap:pretty}\n.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:min(22px,3vh)}\n.b1{background:var(--purple);color:#fff;font-weight:600;font-size:14.5px;padding:min(13px,1.8vh) 24px;border-radius:100px}\n.b1:hover{background:#5b3fd6;color:#fff}\n.b2{border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:500;font-size:14.5px;padding:min(13px,1.8vh) 22px;border-radius:100px}\n.b2:hover{border-color:#fff}\n/* browser-window frame around each print */\n.win{display:flex;flex-direction:column;height:100%;min-height:0;max-height:100%;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#0d0d11;box-shadow:0 26px 60px -24px rgba(0,0,0,.8)}\n.win .bar{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line);background:#141419;flex-shrink:0}\n.win .dots{display:flex;gap:5px}\n.win .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16);display:block}\n.win .url{flex:1;min-width:0;background:#0d0d11;border:1px solid rgba(255,255,255,.07);border-radius:100px;padding:4px 11px;font-size:10.5px;letter-spacing:.3px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.win .view{position:relative;flex:1;min-height:0}\n.shotcap{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);margin-top:10px;display:block}\n.shotcol{display:flex;flex-direction:column;height:100%;min-height:0}\n.shotcol .win{flex:1;min-height:0}\n#walker{position:absolute;z-index:3}\n#walker .body{width:20px;height:20px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 6px rgba(124,92,255,.18),0 0 34px rgba(124,92,255,.7);transition:transform .18s}\n#walker.land .body{animation:land .34s ease-out}\n@keyframes land{0%{transform:translateY(-9px) scaleY(1.14)}55%{transform:translateY(0) scaleY(.82) scaleX(1.12)}100%{transform:none}}\n#walker .shadow{width:34px;height:7px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(3px);margin:6px 0 0 -7px}\nnav{position:fixed;z-index:6;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(20px,4vw,48px)}\n.brand{display:flex;gap:9px;align-items:center;font-weight:700;font-size:19px;letter-spacing:-.5px;color:#fff}\n.brand i{width:9px;height:9px;border-radius:50%;background:var(--purple);display:block}\nnav .in{font-size:14px;font-weight:500;color:rgba(255,255,255,.7);border:1px solid var(--line);padding:8px 16px;border-radius:100px;background:rgba(10,10,11,.45);backdrop-filter:blur(6px)}\nnav .in:hover{border-color:#fff;color:#fff}\n#rail{position:fixed;z-index:6;right:clamp(12px,2vw,22px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:10px}\n#rail a{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:1.4px;color:transparent;transition:color .25s}\n#rail a b{width:14px;height:2px;background:rgba(255,255,255,.2);display:block;transition:all .25s}\n#rail a.on b{width:28px;background:var(--purple-l)}\n#rail a.on,#rail a:hover{color:var(--faint)}\n#alt{position:fixed;z-index:6;left:clamp(20px,4vw,48px);bottom:14px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}\n@media(max-width:760px){#alti,#mark{display:none}}\n#hint{position:fixed;z-index:6;left:50%;bottom:14px;transform:translateX(-50%);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);transition:opacity .4s}\n#hint.hide{opacity:0}\n#hint span{display:inline-block;animation:bob 1.7s ease-in-out infinite}\n@keyframes bob{50%{transform:translateY(4px)}}\n.slot{height:100vh}\n@media(max-width:1000px){.inner{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px}.inner p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.win .view{min-height:120px}.shotcap{display:none}#rail a{display:none}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<nav><div class=\"brand\"><i><\u002Fi>Stepz<\u002Fdiv><a href=\"../Stepz.html\" class=\"in\">Entrar<\u002Fa><\u002Fnav>\n<div id=\"stage\">\n  <div id=\"sky\"><\u002Fdiv>\n  <svg id=\"stars\"><\u002Fsvg>\n  <svg class=\"layer\" id=\"far\" viewBox=\"0 0 1200 300\" preserveAspectRatio=\"none\"><path d=\"M0 300V168l90-52 84 40 96-64 110 58 92-38 104 52 96-70 108 60 96-30 124 66v110z\" fill=\"#262247\"><\u002Fpath><\u002Fsvg>\n  <svg class=\"layer\" id=\"mid\" viewBox=\"0 0 1200 240\" preserveAspectRatio=\"none\"><path d=\"M0 240V150l120-58 104 46 128-58 118 54 110-40 130 56 118-46 136 62 136-28v52z\" fill=\"#1d1a35\"><\u002Fpath><\u002Fsvg>\n  <svg class=\"layer\" id=\"near\" viewBox=\"0 0 1200 180\" preserveAspectRatio=\"none\"><path d=\"M0 180V96l140-40 150 48 160-52 170 56 150-40 160 52 120-30v66z\" fill=\"#141224\"><\u002Fpath><\u002Fsvg>\n  <div id=\"horizon\"><\u002Fdiv>\n  <div id=\"fog\"><\u002Fdiv>\n  <div id=\"cam\"><\u002Fdiv>\n  <div id=\"walker\"><div class=\"body\"><\u002Fdiv><div class=\"shadow\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div id=\"alti\"><div id=\"ruler\"><\u002Fdiv><\u002Fdiv>\n<div id=\"mark\"><span class=\"ln\"><\u002Fspan><\u002Fdiv>\n<div id=\"rail\"><\u002Fdiv>\n<div id=\"alt\">degrau <b id=\"altn\">01<\u002Fb> / 09 &nbsp;·&nbsp; altura <span id=\"meters\">0,00 m<\u002Fspan><\u002Fdiv>\n<div id=\"hint\"><span>role para subir ↓<\u002Fspan><\u002Fdiv>\n<div id=\"track\"><\u002Fdiv>\n<script>\nconst STEPS=[\n {n:\"01\",name:\"O chão\",tag:\"degrau 01 · o chão\",h1:\"Você já subiu mais<br>do que lembra.\",p:\"A memória guarda o que falta, não o que foi feito. Stepz dá altura visível ao esforço que já aconteceu. Role a página: cada rolada sobe um degrau e o degrau abre o que tem dentro.\",sky:\"#0a0a0b\",cta:1,solo:1},\n {n:\"02\",name:\"A escada\",tag:\"degrau 02 · a tela principal\",h2:\"A escada é a tela inicial.\",p:\"Não é um gráfico num canto: é o centro do app. Cada degrau é uma coisa que você concluiu, na ordem em que aconteceu.\",sky:\"#17162b\",shot:\"a escada em tela cheia\",url:\"stepz.app/escada\"},\n {n:\"03\",name:\"Tarefas\",tag:\"degrau 03 · tarefas\",h2:\"Marcou? Virou degrau.\",p:\"Tarefa fecha uma vez e vale um degrau. Sem projeto, sem sprint, sem campo obrigatório para preencher antes.\",sky:\"#131a2d\",shot:\"lista de tarefas do dia\",url:\"stepz.app/tarefas\"},\n {n:\"04\",name:\"Hábitos\",tag:\"degrau 04 · hábitos\",h2:\"Hábito conta por dia mantido.\",p:\"Um degrau a cada dia marcado. A sequência aparece, mas ninguém te pune por quebrá-la.\",sky:\"#0f1d29\",shot:\"painel de hábitos\",url:\"stepz.app/habitos\"},\n {n:\"05\",name:\"Post-its\",tag:\"degrau 05 · post-its\",h2:\"Post-its para o que não é tarefa.\",p:\"Ideia solta, desabafo de meio de semana, o que ficou atravessado. Um quadro ao lado da escada, por categoria.\",sky:\"#0f2019\",shot:\"quadro de post-its\",url:\"stepz.app/post-its\"},\n {n:\"06\",name:\"Zoom\",tag:\"degrau 06 · zoom\",h2:\"De longe, a altura. De perto, os nomes.\",p:\"Afastada, a escada é uma silhueta com marcos dourados. Aproximada, cada degrau mostra a tarefa exata que o construiu e o dia em que aconteceu.\",sky:\"#13202e\",shot:\"escada com zoom aproximado\",url:\"stepz.app/escada?zoom=4\"},\n {n:\"07\",name:\"Patamares\",tag:\"degrau 07 · patamares\",h2:\"A cada dez degraus, um marco que não sai mais.\",p:\"Oito patamares, do Despertar à Plenitude. A paisagem atrás da escada muda para provar que você chegou em outro lugar.\",sky:\"#241f11\",gold:1,shot:\"patamar alcançado\",url:\"stepz.app/patamares\"},\n {n:\"08\",name:\"Jornada\",tag:\"degrau 08 · jornada\",h2:\"Tudo fica gravado por data.\",p:\"A linha do tempo guarda cada dia com o que foi feito nele. É feito para reler, não para se apagar quando você termina.\",sky:\"#1c142a\",shot:\"linha do tempo\",url:\"stepz.app/jornada\"},\n {n:\"09\",name:\"Seu primeiro degrau\",tag:\"degrau 09 · o topo, por hoje\",h2:\"Sua escada começa vazia.\",p:\"Em quarenta segundos ela tem um degrau. Em um mês, uma altura que você não conseguiria descrever de memória.\",sky:\"#171331\",cta:2,solo:1}\n];\nconst cam=document.getElementById('cam'),rail=document.getElementById('rail'),track=document.getElementById('track'),walker=document.getElementById('walker'),sky=document.getElementById('sky'),altn=document.getElementById('altn'),hint=document.getElementById('hint');\nlet SW=0,SH=0,EX=0,PH=0,AX=0,AY=0;const TICK=46;\nfunction dims(){const W=innerWidth,H=innerHeight;SW=Math.min(Math.max(W*.15,116),215);EX=Math.min(W*.70,880);SH=Math.min(Math.max(H*.2,96),215);PH=W<1000?Math.min(Math.max(H*.7,340),620):Math.min(Math.max(H*.56,320),540);AX=W<1000?W*.09:W*.15;AY=H*.82}\ndims();\ncam.innerHTML=STEPS.map((s,i)=>`<div class=\"st${s.gold?' gold':''}${s.solo?' solo':''}\" id=\"st${i}\"><div class=\"num\">${String(i+1).padStart(2,'0')}<\u002Fdiv><div class=\"name\">${s.name}<\u002Fdiv><div class=\"inner\"><div><div class=\"tag\"><i><\u002Fi>${s.tag}<\u002Fdiv>${s.h1?`<h1>${s.h1}<\u002Fh1>`:`<h2>${s.h2}<\u002Fh2>`}<p>${s.p}<\u002Fp>${s.cta?`<div class=\"ctas\"><a href=\"../Stepz.html\" class=\"b1\">${s.cta===1?'Começar grátis':'Construir o primeiro degrau'}<\u002Fa>${s.cta===1?'<a href=\"#s1\" class=\"b2\">Ver como funciona<\u002Fa>':'<a href=\"../Stepz.html\" class=\"b2\">Entrar<\u002Fa>'}<\u002Fdiv>`:''}<\u002Fdiv>${s.shot?`<div class=\"shotcol\"><div class=\"win\"><div class=\"bar\"><div class=\"dots\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv><div class=\"url\">${s.url||'stepz.app'}<\u002Fdiv><\u002Fdiv><div class=\"view\"><image-slot id=\"shotA${i}\" shape=\"rect\" placeholder=\"${s.shot}\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv><span class=\"shotcap\">print · ${s.shot}<\u002Fspan><\u002Fdiv>`:''}<\u002Fdiv><\u002Fdiv>`).join('');\nrail.innerHTML=STEPS.map((s,i)=>`<a href=\"#s${i}\" id=\"rl${i}\">${s.n}<b><\u002Fb><\u002Fa>`).join('');\ntrack.innerHTML=STEPS.map((s,i)=>`<div class=\"slot\" id=\"s${i}\"><\u002Fdiv>`).join('');\nconst sts=STEPS.map((_,i)=>document.getElementById('st'+i)),rls=STEPS.map((_,i)=>document.getElementById('rl'+i));\nconst ruler=document.getElementById('ruler'),meters=document.getElementById('meters'),horizon=document.getElementById('horizon'),far=document.getElementById('far'),mid=document.getElementById('mid'),near=document.getElementById('near'),stars=document.getElementById('stars');\nruler.innerHTML=STEPS.map((s,i)=>`<div class=\"tk${i%2===0?' big':''}\" style=\"top:${-i*TICK}px\"><b><\u002Fb><span>${i%2===0?String(i+1).padStart(2,'0'):''}<\u002Fspan><\u002Fdiv>`).join('');\nconst ez=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;\nlet landT=0;\nconst bump=(i,p)=>Math.max(0,1-Math.abs(p-i));\nlet cur=-1,lastY=-1,lastW=0,lastH=0;\nfunction frame(){\n  const N=STEPS.length,p=Math.max(0,Math.min(N-1,scrollY/innerHeight));\n  const fl=Math.min(N-1,Math.floor(p)),fr=p-fl,pe=fl+ez(fr);\n  const w=[];for(let i=0;i<N;i++)w[i]=SW+EX*Math.max(0,1-Math.abs(pe-i));\n  let x=0,camX=0;\n  for(let i=0;i<N;i++){sts[i].style.left=(AX+x)+'px';sts[i].style.top=(AY-i*SH-PH)+'px';sts[i].style.height=PH+'px';sts[i].style.width=w[i]+'px';if(i<fl)camX+=w[i];x+=w[i]}\n  camX+=ez(fr)*w[fl];\n  cam.style.transform=`translate3d(${-camX}px,${pe*SH}px,0)`;\n  far.style.transform=`translate3d(0,${pe*SH*.3}px,0)`;\n  mid.style.transform=`translate3d(0,${pe*SH*.55}px,0)`;\n  near.style.transform=`translate3d(0,${pe*SH*.8}px,0)`;\n  horizon.style.top=AY+'px';horizon.style.transform=`translateY(${pe*SH*.45}px)`;\n  ruler.style.transform=`translateY(${pe*TICK}px)`;\n  stars.style.opacity=(.2+.62*(pe/(N-1))).toFixed(3);\n  meters.textContent=(pe*.18).toFixed(2).replace('.',',')+' m';\n  walker.style.left=(AX-26)+'px';walker.style.top=(AY-30)+'px';\n  const i=Math.round(p);\n  if(i!==cur){cur=i;sts.forEach((el,k)=>el.classList.toggle('on',k===i));rls.forEach((el,k)=>el.classList.toggle('on',k<=i));sky.style.backgroundColor=STEPS[i].sky;altn.textContent=String(i+1).padStart(2,'0');walker.classList.remove('land');void walker.offsetWidth;walker.classList.add('land');clearTimeout(landT);landT=setTimeout(()=>walker.classList.remove('land'),360)}\n  hint.classList.toggle('hide',scrollY>innerHeight*.35);\n}\nfunction tick(){if(innerWidth!==lastW||innerHeight!==lastH){lastW=innerWidth;lastH=innerHeight;dims();lastY=-1}if(scrollY!==lastY||lastY<0){lastY=scrollY;frame()}requestAnimationFrame(tick)}\nrequestAnimationFrame(tick);\nlet d='';for(let k=0;k<90;k++){d+=`<circle cx=\"${Math.random()*100}%\" cy=\"${Math.random()*78}%\" r=\"${Math.random()*1.3+.3}\" fill=\"#fff\" opacity=\"${Math.random()*.5+.15}\"/>`}\ndocument.getElementById('stars').innerHTML=d;\nframe();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
