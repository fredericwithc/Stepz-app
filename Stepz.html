<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Stepz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0a0b; color: #f2efe9; font-family: 'Inter', system-ui, sans-serif; }
  button { font-family: inherit; }
  input, select { font-family: inherit; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes pop { 0% { transform: scale(.8); opacity: 0; } 60% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); } }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
// Tokens — cores oficiais Stepz: Ink #0a0a0b, Paper #f2efe9, Roxo #7c5cff, gradiente marca #c79bff → #7c5cff, highlight #e9dcff.
const stepzTokens = {
  bg: '#0a0a0b',
  panel: '#111114',
  panel2: '#17171c',
  border: 'rgba(242, 239, 233, 0.06)',
  borderStrong: 'rgba(242, 239, 233, 0.12)',
  text: '#f2efe9',
  textDim: 'rgba(242, 239, 233, 0.62)',
  textFaint: 'rgba(242, 239, 233, 0.38)',
  accent: '#7c5cff',
  accentSoft: 'rgba(124, 92, 255, 0.22)',
  highlight: '#e9dcff',
  accentGradient: 'linear-gradient(135deg, #c79bff 0%, #7c5cff 100%)',
  success: 'oklch(0.70 0.15 145)',
  warn: 'oklch(0.82 0.14 88)',
  font: '"Inter", -apple-system, system-ui, sans-serif',
  fontMono: '"JetBrains Mono", ui-monospace, Menlo, monospace',
};
window.stepzTokens = stepzTokens;
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>

<script type="text/babel" src="app/supabase-client.jsx"></script>
<script type="text/babel" src="app/app.jsx"></script>
</body>
</html>
